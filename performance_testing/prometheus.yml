global:
  scrape_interval: 15s  # How often to scrape targets
  evaluation_interval: 15s  # How often to evaluate rules

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape Django app metrics (if you're exposing metrics through an endpoint like /metrics using a library such as django-prometheus)
  - job_name: 'django'
    metrics_path: /metrics  # If Django exposes metrics on /metrics
    static_configs:
      - targets: ['web:8000']  # Your Django app on port 8000

  # Scrape Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Scrape MySQL Exporter
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']

  # Scrape NGINX Exporter
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # Scrape Celery metrics (if you have Prometheus metrics for Celery workers)
  - job_name: 'celery'
    metrics_path: /metrics
    static_configs:
      - targets: ['celery:8000']  # Update based on your Celery worker configuration
